<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>脱核经营贷 · 授权登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d1b2a; font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .auth-card { width: 90%; max-width: 400px; background: rgba(15,25,35,0.95); backdrop-filter: blur(10px); border-radius: 32px; padding: 28px 22px; box-shadow: 0 20px 35px rgba(0,0,0,0.5); border: 1px solid #2a4055; text-align: center; }
        .auth-card h2 { color: #4fc3f7; margin-bottom: 6px; font-size: 26px; }
        .sub { color: #8ba9c4; font-size: 12px; margin-bottom: 28px; }
        .tab-bar { display: flex; gap: 12px; margin-bottom: 24px; border-bottom: 1px solid #2a4055; }
        .tab-btn { flex: 1; background: none; border: none; padding: 10px; font-size: 16px; font-weight: bold; cursor: pointer; color: #8ba9c4; }
        .tab-btn.active { color: #4fc3f7; border-bottom: 2px solid #4fc3f7; }
        .input-group { text-align: left; margin-bottom: 18px; }
        .input-group label { display: block; font-size: 12px; color: #c8d6e5; margin-bottom: 6px; }
        .input-group input { width: 100%; padding: 12px 14px; background: #112233; border: 1px solid #1e3044; border-radius: 30px; color: #fff; font-size: 14px; outline: none; }
        .input-group input:focus { border-color: #4fc3f7; }
        .auth-btn { width: 100%; padding: 12px; background: #1a73e8; border: none; border-radius: 40px; color: white; font-size: 16px; font-weight: bold; margin-top: 10px; cursor: pointer; transition: opacity 0.2s; }
        .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-msg { color: #e53935; font-size: 12px; margin-top: 12px; min-height: 30px; }
        .info-note { font-size: 11px; color: #7a9bb5; margin-top: 20px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="auth-card">
    <h2>🏦 脱核经营贷</h2>
    <div class="sub">全国 · 供应链作战地图</div>
    <div class="tab-bar">
        <button id="loginTabBtn" class="tab-btn active">登录</button>
        <button id="registerTabBtn" class="tab-btn">注册</button>
    </div>
    <div id="loginForm">
        <div class="input-group"><label>用户名</label><input type="text" id="loginUsername" placeholder="请输入用户名"></div>
        <div class="input-group"><label>密码</label><input type="password" id="loginPassword" placeholder="请输入密码"></div>
        <button class="auth-btn" id="doLoginBtn">登 录</button>
        <div id="loginError" class="error-msg"></div>
    </div>
    <div id="registerForm" style="display: none;">
        <div class="input-group"><label>用户名</label><input type="text" id="regUsername" placeholder="用户名"></div>
        <div class="input-group"><label>密码</label><input type="password" id="regPassword" placeholder="密码"></div>
        <div class="input-group"><label>邀请码</label><input type="text" id="regInviteCode" placeholder="邀请码"></div>
        <button class="auth-btn" id="doRegisterBtn">注 册</button>
        <div id="regError" class="error-msg"></div>
    </div>
</div>
<script>
(function() {
    // ==================== Supabase 配置 ====================
    const SUPABASE_URL = 'https://lcnwkdorftzagvvejeer.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjbndrZG9yZnR6YWd2dmVqZWVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NjE2ODMsImV4cCI6MjA5NjMzNzY4M30.tXUnUfENrRa7eg8HFkzjGtzevUwthq8skzyU2W_Mhmc';
    
    if (typeof window.supabase === 'undefined' || !window.supabase.createClient) {
        alert('Supabase SDK 加载失败，请刷新页面重试');
        throw new Error('Supabase SDK 未正确加载');
    }
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const NORMAL_INVITE = "XJ2026";
    const SUPER_INVITE = "SUPER2026";

    // UI 切换
    const loginFormDiv = document.getElementById('loginForm');
    const registerFormDiv = document.getElementById('registerForm');
    const loginTab = document.getElementById('loginTabBtn');
    const registerTab = document.getElementById('registerTabBtn');
    function showLogin() { loginFormDiv.style.display = 'block'; registerFormDiv.style.display = 'none'; loginTab.classList.add('active'); registerTab.classList.remove('active'); clearErrors(); }
    function showRegister() { loginFormDiv.style.display = 'none'; registerFormDiv.style.display = 'block'; registerTab.classList.add('active'); loginTab.classList.remove('active'); clearErrors(); }
    function clearErrors() { document.getElementById('loginError').innerText = ''; document.getElementById('regError').innerText = ''; }
    loginTab.addEventListener('click', showLogin);
    registerTab.addEventListener('click', showRegister);

    // 辅助函数：将普通用户名转换为 email 格式
    function toEmail(username) {
        return username.toLowerCase().replace(/[^a-z0-9]/g, '') + '@trade.local';
    }

    // 防重复提交标志
    let isRegistering = false;

    // 注册
    const registerBtn = document.getElementById('doRegisterBtn');
    registerBtn.addEventListener('click', async () => {
        if (isRegistering) return;
        const username = document.getElementById('regUsername').value.trim();
        const password = document.getElementById('regPassword').value.trim();
        const invite = document.getElementById('regInviteCode').value.trim();
        const errorDiv = document.getElementById('regError');
        
        if (!username || !password) { errorDiv.innerText = '用户名/密码不能为空'; return; }
        let role = null;
        if (invite === NORMAL_INVITE) role = 'normal';
        else if (invite === SUPER_INVITE) role = 'super';
        else { errorDiv.innerText = '邀请码错误'; return; }
        
        const email = toEmail(username);
        isRegistering = true;
        registerBtn.disabled = true;
        errorDiv.innerText = '⏳ 注册中...';
        
        try {
            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password,
                options: { data: { role: role } }
            });
            if (error) {
                // 处理速率限制错误
                if (error.message && error.message.toLowerCase().includes('rate limit')) {
                    errorDiv.innerText = '注册请求过于频繁，请等待 1-2 分钟后重试';
                } else if (error.message.includes('already registered')) {
                    errorDiv.innerText = '用户名已存在';
                } else {
                    errorDiv.innerText = error.message;
                }
                return;
            }
            errorDiv.innerText = '注册成功！请登录';
            document.getElementById('regUsername').value = '';
            document.getElementById('regPassword').value = '';
            document.getElementById('regInviteCode').value = '';
            showLogin();
        } catch (err) {
            console.error(err);
            errorDiv.innerText = '网络错误，请稍后重试';
        } finally {
            isRegistering = false;
            registerBtn.disabled = false;
            // 如果错误信息还显示“注册中...”，清空
            if (errorDiv.innerText === '⏳ 注册中...') errorDiv.innerText = '';
        }
    });

    // 登录（也可添加防重复，但速率限制没那么严格）
    let isLoggingIn = false;
    const loginBtn = document.getElementById('doLoginBtn');
    loginBtn.addEventListener('click', async () => {
        if (isLoggingIn) return;
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const errorDiv = document.getElementById('loginError');
        if (!username || !password) { errorDiv.innerText = '请输入用户名和密码'; return; }
        const email = toEmail(username);
        isLoggingIn = true;
        loginBtn.disabled = true;
        errorDiv.innerText = '⏳ 登录中...';
        try {
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) { errorDiv.innerText = '用户名或密码错误'; return; }
            // 获取角色
            const { data: roleData, error: roleError } = await supabase
                .from('user_roles')
                .select('role')
                .eq('user_id', data.user.id)
                .single();
            if (roleError && roleError.code !== 'PGRST116') {
                console.warn('角色查询失败', roleError);
            }
            const role = roleData?.role || 'normal';
            localStorage.setItem('trade_map_currentUser', username);
            localStorage.setItem('trade_map_userRole', role);
            localStorage.setItem('trade_map_userId', data.user.id);
            window.location.href = 'map.html';
        } catch (err) {
            console.error(err);
            errorDiv.innerText = '网络错误，请检查网络连接后重试';
        } finally {
            isLoggingIn = false;
            loginBtn.disabled = false;
            if (errorDiv.innerText === '⏳ 登录中...') errorDiv.innerText = '';
        }
    });

    // 已登录直接跳转
    (async () => {
        try {
            const { data } = await supabase.auth.getSession();
            if (data.session) {
                window.location.href = 'map.html';
            }
        } catch (err) {
            console.warn('Session 检查失败', err);
        }
    })();
})();
</script>
</body>
</html>

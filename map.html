<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>全国 · 脱核经营贷作战地图 · 客户经理工作台</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: #0d1b2a;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #app {
            display: flex;
            height: 100%;
            width: 100%;
        }

        #map {
            flex: 1;
            background: #cbd5e1;
            z-index: 1;
            min-height: 0;
        }

        #side {
            width: 420px;
            background: #0f1923;
            color: #c8d6e5;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #1e3044;
            overflow: hidden;
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.5);
        }

        #side-header {
            background: linear-gradient(135deg, #0d2137, #0f1923);
            padding: 8px 12px;
            border-bottom: 1px solid #1e3044;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        #side-header h2 {
            font-size: 14px;
            color: #4fc3f7;
            margin-bottom: 2px;
        }
        .meta {
            font-size: 9px;
            color: #6c8fb3;
        }
        .logout-btn {
            background: #1e3a2e;
            border: none;
            color: #8bc34a;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 紧凑统计栏 */
        #stats {
            display: flex;
            gap: 5px;
            padding: 6px 8px;
            background: #0a1623;
            border-bottom: 1px solid #1e3044;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .stat {
            flex: 1;
            min-width: 58px;
            text-align: center;
            padding: 4px 2px;
            background: #112233;
            border-radius: 8px;
        }
        .stat .v {
            font-size: 14px;
            font-weight: bold;
            color: #4fc3f7;
        }
        .stat .l {
            font-size: 9px;
            color: #7a9bb5;
        }
        .stat.today-remind {
            background: #2a3a2e;
        }

        /* 筛选栏 更紧凑 */
        #filters {
            display: flex;
            gap: 6px;
            padding: 6px 8px;
            background: #0a1623;
            border-bottom: 1px solid #1e3044;
            flex-wrap: wrap;
            align-items: center;
            flex-shrink: 0;
        }
        #filters input {
            flex: 2;
            min-width: 120px;
            background: #112233;
            border: 1px solid #1e3044;
            color: #c8d6e5;
            padding: 6px 10px;
            border-radius: 30px;
            font-size: 12px;
            outline: none;
        }
        .export-btn {
            background: #1e3a2e;
            border: none;
            color: #8bc34a;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 10px;
            cursor: pointer;
        }

        /* 行业筛选 / 状态筛选 滚动两行高度更紧凑 */
        .industry-filter, .status-filter {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 4px 8px;
            max-height: 60px;
            overflow-y: auto;
            align-items: center;
            flex-shrink: 0;
            padding: 3px 2px;
            scrollbar-width: thin;
        }
        .industry-filter-item, .status-filter-item {
            padding: 3px 10px;
            border-radius: 30px;
            background: #112233;
            cursor: pointer;
            font-size: 10px;
            white-space: nowrap;
            transition: 0.1s;
        }
        .industry-filter-item.active, .status-filter-item.active {
            background: #1a73e8;
            color: white;
        }
        .filter-divider {
            margin: 2px 8px;
            height: 1px;
            background: #2a4055;
            flex-shrink: 0;
        }

        /* 商机列表区域 - 极致紧凑，保证手机屏幕可见至少2条完整卡片 */
        #lead-list {
            flex: 1;
            overflow-y: auto;
            padding: 5px 8px 10px 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* 卡片样式：减少留白，合并信息行 */
        .lead-card {
            padding: 6px 8px;
            background: #112233;
            border-radius: 12px;
            border-left: 3px solid #4fc3f7;
            cursor: pointer;
            transition: 0.05s linear;
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        .lead-card.S {
            border-left-color: #e53935;
        }
        .lead-card.A {
            border-left-color: #ffa726;
        }
        /* 第一行：排名+名称+徽章 紧凑 */
        .lc-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 3px;
            margin-bottom: 2px;
        }
        .lc-name {
            font-weight: 700;
            font-size: 12px;
            color: #e0e0e0;
            letter-spacing: 0.2px;
        }
        .lc-badges {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
        }
        .lc-badge {
            padding: 1px 5px;
            border-radius: 20px;
            font-size: 7px;
            font-weight: bold;
        }
        .badge-star {
            background: #fff3e0;
            color: #e65100;
        }
        .badge-s {
            background: #e5393533;
            color: #e53935;
        }
        .badge-a {
            background: #ffa72633;
            color: #ffa726;
        }
        .badge-strong {
            background: #4caf5033;
            color: #66bb6a;
        }
        .badge-mid {
            background: #ffa72633;
            color: #ffa726;
        }

        /* 第二行：行业/资本/总分/核心企业 超紧凑 */
        .lc-info-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 9px;
            color: #8ba9c4;
            margin: 2px 0 2px 0;
            align-items: baseline;
        }
        .lc-info-row span {
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }
        .core-enterprise {
            color: #ffd966;
            max-width: 140px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 操作栏: 电话&导航 极简按钮 */
        .lc-actions {
            display: flex;
            gap: 8px;
            margin: 4px 0 3px;
        }
        .lc-actions a {
            background: #1e3a2e;
            color: #8bc34a;
            text-decoration: none;
            padding: 2px 6px;
            border-radius: 20px;
            font-size: 9px;
            cursor: pointer;
            display: inline-block;
        }

        /* 跟进控件区域 超紧凑 */
        .lc-followup {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 4px;
            align-items: center;
        }
        .status-select {
            background: #0a1623;
            color: #c8d6e5;
            border: 1px solid #2a4055;
            border-radius: 20px;
            padding: 2px 6px;
            font-size: 9px;
            width: auto;
        }
        .remark-btn, .remind-btn {
            background: #1e3a2e;
            border: none;
            color: #8bc34a;
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 9px;
            cursor: pointer;
        }

        #lead-count {
            font-size: 9px;
            padding: 2px 10px 2px;
            color: #7a9bb5;
            flex-shrink: 0;
        }

        #legend2 {
            position: absolute;
            bottom: 15px;
            left: 12px;
            background: #0f1923dd;
            backdrop-filter: blur(8px);
            padding: 3px 8px;
            border-radius: 12px;
            color: #c8d6e5;
            font-size: 9px;
            z-index: 1000;
            pointer-events: none;
        }

        .leaflet-popup-content {
            font-size: 12px;
            min-width: 200px;
        }

        .pop-phone-link, .pop-nav-link {
            display: inline-block;
            background: #e9f5ef;
            padding: 2px 8px;
            border-radius: 20px;
            margin-right: 6px;
            text-decoration: none;
            color: #2e7d64;
            cursor: pointer;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 16px;
            backdrop-filter: blur(8px);
        }

        /* 移动端重点：地图比例适当，列表高度足够，卡片内容可完整显示2条以上 */
        @media (max-width: 780px) {
            #app {
                flex-direction: column;
            }
            #map {
                height: 38vh;
                min-height: 220px;
            }
            #side {
                width: 100%;
                height: 62vh;
                border-top: 2px solid #1e3044;
            }
            /* 列表区域加大内部紧凑性，确保每条卡片高度 <= 82px 左右，6条可见 */
            .lead-card {
                padding: 5px 7px;
            }
            .lc-name {
                font-size: 11px;
            }
            .lc-badge {
                font-size: 6px;
                padding: 1px 4px;
            }
            .lc-info-row {
                font-size: 8px;
                gap: 5px;
            }
            .lc-actions a {
                padding: 2px 5px;
                font-size: 8px;
            }
            .status-select {
                font-size: 8px;
                padding: 2px 5px;
            }
            .remark-btn, .remind-btn {
                font-size: 8px;
                padding: 2px 6px;
            }
            .industry-filter, .status-filter {
                max-height: 55px;
                margin: 3px 6px;
            }
        }
        /* 超小机型继续压缩行高 */
        @media (max-width: 480px) {
            .lead-card {
                padding: 4px 6px;
            }
            .lc-info-row {
                gap: 4px;
            }
            .lc-followup {
                gap: 4px;
            }
        }
    </style>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app" style="display: none;">
    <div id="map"></div>
    <div id="side">
        <div id="side-header">
            <div><h2>🎯 客户经理工作台</h2><div class="meta">脱核经营贷 · 全国供应链</div></div>
            <div><button id="logoutBtn" class="logout-btn">🚪 退出</button></div>
        </div>
        <div id="stats">
            <div class="stat"><div class="v" id="stat-total">0</div><div class="l">商机</div></div>
            <div class="stat"><div class="v" id="stat-s">0</div><div class="l">S级</div></div>
            <div class="stat"><div class="v" id="stat-star">0</div><div class="l">⭐背书</div></div>
            <div class="stat"><div class="v" id="stat-strong">0</div><div class="l">强意愿</div></div>
            <div class="stat"><div class="v" id="stat-avg">0</div><div class="l">均分</div></div>
            <div class="stat today-remind"><div class="v" id="stat-today">0</div><div class="l">今日待跟进</div></div>
        </div>
        <div id="filters">
            <input type="text" id="search" placeholder="🔍 搜索企业名/核心企业/产品" oninput="filterLeads()">
            <button class="export-btn" id="exportBtn" style="display: none;">📎 导出CSV</button>
        </div>
        <!-- 行业筛选栏 -->
        <div class="industry-filter" id="industryFilterBar">
            <span style="font-size:10px; margin-right:4px;">🏭 行业：</span>
            <span data-industry="全部" class="industry-filter-item active" onclick="setIndustry('全部')">全部</span>
        </div>
        <!-- 分割线与状态栏将在js中动态插入 -->
        <div id="lead-count">加载数据中...</div>
        <div id="lead-list"></div>
    </div>
</div>
<div id="legend2" style="display: none;">📊 图例 🔴S级 🟠A级 ⭐背书 ❤️强意愿 ▫️产业集群</div>
<div id="loadingIndicator" class="loading-overlay">📡 正在加载商机数据...</div>

<script>
(function() {
    // ==================== Supabase 配置 ====================
    const SUPABASE_URL = 'https://lcnwkdorftzagvvejeer.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjbndrZG9yZnR6YWd2dmVqZWVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NjE2ODMsImV4cCI6MjA5NjMzNzY4M30.tXUnUfENrRa7eg8HFkzjGtzevUwthq8skzyU2W_Mhmc';
    
    if (typeof window.supabase === 'undefined' || !window.supabase.createClient) {
        alert('Supabase SDK 加载失败，请刷新页面重试');
        throw new Error('Supabase SDK 未正确加载');
    }
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let userFollowups = {};
    let allLeads = [];
    let map, markers = [];
    let currentIndustry = '全部';
    let currentStatusFilter = '全部';

    // ---------- 辅助函数 ----------
    async function getCurrentUser() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) throw new Error('未登录');
        const { data: roleData } = await supabase
            .from('user_roles')
            .select('role')
            .eq('user_id', user.id)
            .single();
        const role = roleData?.role || 'normal';
        const username = user.email.split('@')[0];
        return { id: user.id, email: user.email, username, role };
    }

    function maskPhone(phone) {
        if (!phone) return '暂无';
        if (currentUser.role === 'super') return phone;
        return phone.slice(0,3) + '****' + phone.slice(-4);
    }
    function maskCoreEnterprise(name) {
        if (!name) return '暂无';
        if (currentUser.role === 'super') return name;
        if (name.length <= 2) return '**';
        return name.slice(0,2) + '***';
    }

    async function logEvent(leadRank, eventType) {
        try {
            await supabase.from('events').insert({
                user_id: currentUser.id,
                lead_rank: leadRank,
                event_type: eventType
            });
        } catch (e) { console.warn(e); }
    }

    function handleCall(phone, leadName, leadRank) {
        if (!phone) return;
        logEvent(leadRank, 'call');
        if (currentUser.role === 'super') {
            window.location.href = `tel:${phone}`;
        } else {
            if (confirm(`即将拨打 ${leadName} 的号码：${phone}\n\n确认拨号吗？`)) {
                window.location.href = `tel:${phone}`;
            }
        }
    }

    function navigateToAmap(lat, lng, name, leadRank) {
        if (!lat || !lng) return;
        logEvent(leadRank, 'navigate');
        const encodedName = encodeURIComponent(name || '目标位置');
        window.location.href = `https://uri.amap.com/navigation?to=${lng},${lat}&toName=${encodedName}&mode=car&callnative=1`;
    }

    // ---------- 数据操作 ----------
    async function loadOpportunities() {
        const { data, error } = await supabase
            .from('opportunities')
            .select('*')
            .order('rank', { ascending: true });
        if (error) throw error;
        return data;
    }

    async function loadFollowups() {
        const { data, error } = await supabase
            .from('followups')
            .select('lead_rank, status, remark, remind_date')
            .eq('user_id', currentUser.id);
        if (error) throw error;
        const map = {};
        data.forEach(f => {
            map[f.lead_rank] = {
                status: f.status,
                remark: f.remark || '',
                remindDate: f.remind_date
            };
        });
        return map;
    }

    async function upsertFollowup(leadRank, updateData) {
        const { error } = await supabase
            .from('followups')
            .upsert({
                user_id: currentUser.id,
                lead_rank: leadRank,
                ...updateData,
                updated_at: new Date()
            }, { onConflict: 'user_id, lead_rank' });
        if (error) console.error('更新失败', error);
    }

    async function updateStatus(rank, newStatus) {
        await upsertFollowup(rank, { status: newStatus });
        userFollowups[rank] = { ...userFollowups[rank], status: newStatus };
        renderLeadList();
        renderMarkers();
    }

    async function editRemark(rank) {
        const currentRemark = userFollowups[rank]?.remark || '';
        const newRemark = prompt('请输入备注（记录沟通要点）', currentRemark);
        if (newRemark !== null) {
            await upsertFollowup(rank, { remark: newRemark });
            userFollowups[rank] = { ...userFollowups[rank], remark: newRemark };
            renderLeadList();
        }
    }

    async function setRemind(rank) {
        const currentRemind = userFollowups[rank]?.remindDate || '';
        const newRemind = prompt('提醒日期格式：2025-06-10', currentRemind);
        if (newRemind && /^\d{4}-\d{2}-\d{2}$/.test(newRemind)) {
            await upsertFollowup(rank, { remind_date: newRemind });
            userFollowups[rank] = { ...userFollowups[rank], remindDate: newRemind };
            renderLeadList();
            alert(`已设置 ${newRemind} 提醒`);
        } else if (newRemind) alert('日期格式应为 YYYY-MM-DD');
    }

    function buildPopupHtml(lead) {
        const starIcon = lead.star ? '⭐' : '';
        const status = userFollowups[lead.rank]?.status || '待跟进';
        const displayPhone = maskPhone(lead.phone);
        const displayCore = maskCoreEnterprise(lead.core_enterprise);
        const phoneLink = currentUser.role === 'super'
            ? `<a href="tel:${lead.phone}" class="pop-phone-link">${displayPhone}</a>`
            : `<a href="javascript:void(0)" onclick="handleCall('${lead.phone}', '${lead.name.replace(/'/g, "\\'")}', ${lead.rank})" class="pop-phone-link">${displayPhone}</a>`;
        return `<div style="min-width:200px;">
            <h4>${starIcon} ${lead.name}</h4>
            <div><strong>排名：</strong>#${lead.rank} | <strong>总分：</strong>${lead.total}分</div>
            <div><strong>优先级：</strong>${lead.priority} | <strong>意愿度：</strong>${lead.willingness}</div>
            <div><strong>📱 手机：</strong> ${phoneLink}</div>
            <div><strong>📍 地址：</strong>${lead.address}</div>
            <div><strong>🏭 核心企业：</strong>${displayCore}</div>
            <div><strong>📦 产品：</strong>${lead.product}</div>
            <div><a href="javascript:void(0)" onclick="navigateToAmap(${lead.lat}, ${lead.lng}, '${lead.name.replace(/'/g, "\\'")}', ${lead.rank})" class="pop-nav-link">🗺️ 高德导航</a></div>
            <div><strong>跟进：</strong> ${status}</div>
        </div>`;
    }

    function renderMarkers() {
        if (markers.length) markers.forEach(m => map.removeLayer(m));
        markers = [];
        allLeads.forEach(lead => {
            const color = lead.priority === 'S级' ? '#e53935' : '#ffa726';
            const radius = lead.priority === 'S级' ? 8 : 6;
            const m = L.circleMarker([lead.lat, lead.lng], {radius, color, fillColor:color, fillOpacity:0.7, weight: lead.star ? 2 : 1});
            m.bindPopup(buildPopupHtml(lead));
            m._leadData = lead;
            m.addTo(map);
            markers.push(m);
        });
    }

    function renderLeadList() {
        const searchTerm = document.getElementById('search').value.toLowerCase();
        let filtered = allLeads.filter(l => currentIndustry === '全部' || l.industry === currentIndustry);
        if (currentStatusFilter !== '全部') {
            if (currentStatusFilter === '今日提醒') {
                const today = new Date().toISOString().slice(0,10);
                filtered = filtered.filter(l => userFollowups[l.rank]?.remindDate === today);
            } else {
                filtered = filtered.filter(l => (userFollowups[l.rank]?.status || '待跟进') === currentStatusFilter);
            }
        }
        if (searchTerm) {
            filtered = filtered.filter(l => l.name.toLowerCase().includes(searchTerm) || l.core_enterprise.toLowerCase().includes(searchTerm) || l.product.toLowerCase().includes(searchTerm) || l.industry.toLowerCase().includes(searchTerm));
        }
        document.getElementById('lead-count').textContent = `📋 显示 ${filtered.length} 条商机`;

        // 同步地图标记显隐
        markers.forEach(m => {
            const lead = m._leadData;
            let visible = (currentIndustry === '全部' || lead.industry === currentIndustry);
            if (currentStatusFilter !== '全部') {
                if (currentStatusFilter === '今日提醒') {
                    const today = new Date().toISOString().slice(0,10);
                    visible = visible && (userFollowups[lead.rank]?.remindDate === today);
                } else {
                    visible = visible && (userFollowups[lead.rank]?.status || '待跟进') === currentStatusFilter;
                }
            }
            if (visible && searchTerm) visible = lead.name.toLowerCase().includes(searchTerm) || lead.core_enterprise.toLowerCase().includes(searchTerm) || lead.product.toLowerCase().includes(searchTerm) || lead.industry.toLowerCase().includes(searchTerm);
            if (visible) { if (!map.hasLayer(m)) m.addTo(map); } else { if (map.hasLayer(m)) map.removeLayer(m); }
        });

        const container = document.getElementById('lead-list');
        container.innerHTML = filtered.map(l => {
            const starBadge = l.star ? '<span class="lc-badge badge-star">⭐背书</span>' : '';
            const priBadge = l.priority === 'S级' ? '<span class="lc-badge badge-s">S级</span>' : '<span class="lc-badge badge-a">A级</span>';
            const willBadge = l.willingness === '强' ? '<span class="lc-badge badge-strong">强意愿</span>' : '<span class="lc-badge badge-mid">中意愿</span>';
            const status = userFollowups[l.rank]?.status || '待跟进';
            const remark = userFollowups[l.rank]?.remark || '';
            const remindDate = userFollowups[l.rank]?.remindDate || '';
            const statusOptions = ['待跟进','已联系','有意向','已签约','已放款','无效'];
            const displayPhone = maskPhone(l.phone);
            const displayCoreShort = maskCoreEnterprise(l.core_enterprise);
            const phoneAction = currentUser.role === 'super'
                ? `<a href="tel:${l.phone}" onclick="event.stopPropagation()">📞 ${displayPhone}</a>`
                : `<a href="javascript:void(0)" onclick="event.stopPropagation(); handleCall('${l.phone}', '${l.name.replace(/'/g, "\\'")}', ${l.rank})">📞 ${displayPhone}</a>`;
            
            return `<div class="lead-card ${l.priority === 'S级' ? 'S' : 'A'}" onclick="flyToLead(${l.lat},${l.lng},'${l.name.replace(/'/g,"\\'")}')">
                <div class="lc-top">
                    <div class="lc-name">#${l.rank} ${l.name}</div>
                    <div class="lc-badges">${starBadge}${priBadge}${willBadge}</div>
                </div>
                <div class="lc-info-row">
                    <span>🏭 ${l.industry}</span>
                    <span>💰 ${l.capital}万</span>
                    <span>📊 ${l.total}分</span>
                    <span>⭐ 核心: <span class="core-enterprise" title="${l.core_enterprise}">${displayCoreShort}</span></span>
                </div>
                <div class="lc-actions" onclick="event.stopPropagation()">
                    ${phoneAction}
                    <a href="javascript:void(0)" onclick="event.stopPropagation(); navigateToAmap(${l.lat}, ${l.lng}, '${l.name.replace(/'/g, "\\'")}', ${l.rank})">🗺️ 导航</a>
                </div>
                <div class="lc-followup" onclick="event.stopPropagation()">
                    <select class="status-select" data-rank="${l.rank}" onchange="updateStatus(${l.rank}, this.value)">
                        ${statusOptions.map(opt => `<option value="${opt}" ${status === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                    </select>
                    <button class="remark-btn" onclick="editRemark(${l.rank})">📝 ${remark ? '✓' : '备注'}</button>
                    <button class="remind-btn" onclick="setRemind(${l.rank})">⏰ ${remindDate ? remindDate.slice(5) : '提醒'}</button>
                </div>
            </div>`;
        }).join('');
        updateStats(filtered);
    }

    function updateStats(filtered) {
        document.getElementById('stat-total').innerText = filtered.length;
        document.getElementById('stat-s').innerText = filtered.filter(l=>l.priority==='S级').length;
        document.getElementById('stat-star').innerText = filtered.filter(l=>l.star).length;
        document.getElementById('stat-strong').innerText = filtered.filter(l=>l.willingness==='强').length;
        let avg = filtered.length ? Math.round(filtered.reduce((s,l)=>s+l.total,0)/filtered.length) : 0;
        document.getElementById('stat-avg').innerText = avg;
        const today = new Date().toISOString().slice(0,10);
        const todayCount = filtered.filter(l => userFollowups[l.rank]?.remindDate === today).length;
        document.getElementById('stat-today').innerText = todayCount;
    }

    function setIndustry(industry) {
        currentIndustry = industry;
        document.querySelectorAll('.industry-filter-item').forEach(el => {
            el.classList.remove('active');
            if (el.getAttribute('data-industry') === industry) el.classList.add('active');
        });
        renderLeadList();
    }

    function setStatusFilter(status) {
        currentStatusFilter = status;
        document.querySelectorAll('.status-filter-item').forEach(el => {
            el.classList.remove('active');
            if (el.getAttribute('data-status') === status) el.classList.add('active');
        });
        renderLeadList();
    }

    window.flyToLead = function(lat,lng,name) {
        map.flyTo([lat,lng], 14, {duration:0.6});
        setTimeout(() => markers.forEach(m => { if(m._leadData.name === name) m.openPopup(); }), 700);
    };
    window.filterLeads = function() { renderLeadList(); };
    window.handleCall = handleCall;
    window.setIndustry = setIndustry;
    window.setStatusFilter = setStatusFilter;
    window.updateStatus = updateStatus;
    window.editRemark = editRemark;
    window.setRemind = setRemind;
    window.navigateToAmap = navigateToAmap;

    async function exportToCSV() {
        if (currentUser.role !== 'super') { alert('仅超级账号可导出'); return; }
        const searchTerm = document.getElementById('search').value.toLowerCase();
        let filtered = allLeads.filter(l => currentIndustry === '全部' || l.industry === currentIndustry);
        if (searchTerm) filtered = filtered.filter(l => l.name.toLowerCase().includes(searchTerm) || l.core_enterprise.toLowerCase().includes(searchTerm) || l.product.toLowerCase().includes(searchTerm) || l.industry.toLowerCase().includes(searchTerm));
        const rows = filtered.map(l => {
            const ud = userFollowups[l.rank] || {};
            return { "排名": l.rank, "企业名称": l.name, "行业": l.industry, "优先级": l.priority, "意愿度": l.willingness, "总分": l.total, "电话": l.phone, "地址": l.address, "核心企业": l.core_enterprise, "跟进状态": ud.status || "待跟进", "备注": ud.remark || "", "提醒日期": ud.remindDate || "" };
        });
        const csv = [Object.keys(rows[0]).join(","), ...rows.map(row => Object.values(row).map(v => JSON.stringify(v||"")).join(","))].join("\n");
        const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.setAttribute("download", `商机跟进_${currentUser.username}_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    function initMap() {
        map = L.map('map').setView([39.9042, 116.4074], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap',
            maxZoom: 19
        }).addTo(map);
        if(window.innerWidth <= 780) map.zoomControl.setPosition('bottomright');
        window.addEventListener('resize', () => map.invalidateSize());
        L.circle([39.9,116.4], {radius:80000, color:"#f47738", weight:1.5, dashArray:'5 5', fill:false}).addTo(map).bindTooltip("京津冀装备集群");
    }

    async function init() {
        try {
            currentUser = await getCurrentUser();
            const [opportunities, followups] = await Promise.all([loadOpportunities(), loadFollowups()]);
            allLeads = opportunities;
            userFollowups = followups;

            // 行业选项
            const industries = [...new Set(allLeads.map(l => l.industry).filter(Boolean))];
            const industryBar = document.getElementById('industryFilterBar');
            industries.forEach(ind => {
                const span = document.createElement('span');
                span.className = 'industry-filter-item';
                span.setAttribute('data-industry', ind);
                span.innerText = ind;
                span.onclick = () => setIndustry(ind);
                industryBar.appendChild(span);
            });

            // 状态筛选插入
            const divider = document.createElement('div');
            divider.className = 'filter-divider';
            const statusContainer = document.createElement('div');
            statusContainer.className = 'status-filter';
            statusContainer.id = 'dynamicStatusFilter';
            const statuses = ['全部', '待跟进', '已联系', '有意向', '已签约', '已放款', '无效', '今日提醒'];
            statuses.forEach(st => {
                const span = document.createElement('span');
                span.className = 'status-filter-item';
                span.setAttribute('data-status', st);
                span.innerText = st === '今日提醒' ? '📅 今日提醒' : st;
                if (st === '全部') span.classList.add('active');
                span.onclick = () => setStatusFilter(st);
                statusContainer.appendChild(span);
            });
            industryBar.insertAdjacentElement('afterend', divider);
            divider.insertAdjacentElement('afterend', statusContainer);

            document.getElementById('loadingIndicator').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            document.getElementById('legend2').style.display = 'block';
            initMap();
            renderMarkers();
            renderLeadList();

            if (currentUser.role === 'super') {
                document.getElementById('exportBtn').style.display = 'inline-block';
                document.getElementById('exportBtn').onclick = exportToCSV;
            }
        } catch (err) {
            console.error(err);
            document.getElementById('loadingIndicator').innerHTML = '❌ 初始化失败，请重新登录<br>' + err.message;
            setTimeout(() => { window.location.href = 'index.html'; }, 2000);
        }
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await supabase.auth.signOut();
        localStorage.clear();
        window.location.href = 'index.html';
    });

    init();
})();
</script>
</body>
</html>

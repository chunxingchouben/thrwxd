<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>乌鲁木齐 · 脱核经营贷作战地图 · 客户经理工作台</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; background: #0d1b2a; overflow: hidden; height: 100vh; width: 100vw; }
        #app { display: flex; height: 100%; width: 100%; }
        #map { flex: 1; background: #e0e7f0; z-index: 1; }
        #side { width: 420px; background: #0f1923; color: #c8d6e5; display: flex; flex-direction: column; border-left: 1px solid #1e3044; overflow: hidden; box-shadow: -4px 0 20px rgba(0,0,0,0.5); }
        #side-header { background: linear-gradient(135deg,#0d2137,#0f1923); padding: 10px 14px; border-bottom: 1px solid #1e3044; display: flex; justify-content: space-between; align-items: center; }
        #side-header h2 { font-size: 15px; color: #4fc3f7; margin-bottom: 2px; }
        .logout-btn { background: #1e3a2e; border: none; color: #8bc34a; padding: 5px 12px; border-radius: 30px; font-size: 11px; cursor: pointer; font-weight: bold; }
        #stats { display: flex; gap: 6px; padding: 8px 10px; background: #0a1623; border-bottom: 1px solid #1e3044; flex-wrap: wrap; }
        .stat { flex: 1; min-width: 68px; text-align: center; padding: 6px 2px; background: #112233; border-radius: 8px; }
        .stat .v { font-size: 17px; font-weight: bold; color: #4fc3f7; }
        .stat .l { font-size: 10px; color: #7a9bb5; margin-top: 2px; }
        .stat.today-remind { background: #2a3a2e; }
        #filters { display: flex; gap: 6px; padding: 8px 10px; background: #0a1623; border-bottom: 1px solid #1e3044; flex-wrap: wrap; align-items: center; }
        #filters input { flex: 2; min-width: 120px; background: #112233; border: 1px solid #1e3044; color: #c8d6e5; padding: 8px 10px; border-radius: 30px; font-size: 13px; outline: none; }
        .filter-btn { padding: 6px 14px; border-radius: 30px; border: 1px solid #1e3044; background: #112233; color: #8ba9c4; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .filter-btn.active { background: #1a73e8; color: #fff; border-color: #1a73e8; }
        .status-filter { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 10px; }
        .status-filter-item { padding: 3px 10px; border-radius: 20px; background: #112233; cursor: pointer; font-size: 11px; }
        .status-filter-item.active { background: #1a73e8; }
        #lead-list { flex: 1; overflow-y: auto; padding: 6px 6px 20px 6px; }
        .lead-card { padding: 10px 12px; margin: 6px 0; background: #112233; border-radius: 12px; border-left: 3px solid #4fc3f7; cursor: pointer; }
        .lead-card.S { border-left-color: #e53935; }
        .lead-card.A { border-left-color: #ffa726; }
        .lc-top { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .lc-name { font-weight: bold; color: #e0e0e0; font-size: 13px; }
        .lc-badges { display: flex; gap: 4px; }
        .lc-badge { padding: 2px 6px; border-radius: 20px; font-size: 9px; font-weight: bold; }
        .badge-star { background: #fff3e0; color: #e65100; }
        .badge-s { background: #e5393533; color: #e53935; }
        .badge-a { background: #ffa72633; color: #ffa726; }
        .badge-strong { background: #4caf5033; color: #66bb6a; }
        .badge-mid { background: #ffa72633; color: #ffa726; }
        .lc-info { display: flex; gap: 8px; font-size: 10px; color: #8ba9c4; margin: 4px 0; }
        .lc-core { font-size: 11px; color: #4fc3f7; margin: 2px 0; }
        .lc-actions { display: flex; gap: 12px; margin-top: 6px; }
        .lc-actions a { color: #66bb6a; text-decoration: none; background: #1e3a2e; padding: 3px 10px; border-radius: 20px; font-size: 11px; }
        .lc-followup { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }
        .status-select { background: #0a1623; color: #c8d6e5; border: 1px solid #2a4055; border-radius: 20px; padding: 3px 8px; font-size: 11px; }
        .remark-btn, .remind-btn { background: #1e3a2e; border: none; color: #8bc34a; border-radius: 20px; padding: 3px 8px; font-size: 11px; cursor: pointer; }
        #legend2 { position: absolute; bottom: 15px; left: 12px; background: #0f1923dd; backdrop-filter: blur(8px); padding: 5px 10px; border-radius: 12px; color: #c8d6e5; font-size: 10px; z-index: 1000; pointer-events: none; }
        .leaflet-popup-content { font-size: 12px; min-width: 240px; }
        .pop-phone-link, .pop-nav-link { display: inline-block; background: #e9f5ef; padding: 2px 8px; border-radius: 20px; margin-right: 6px; text-decoration: none; color: #2e7d64; }
        #online-badge { position: absolute; top: 12px; right: 12px; background: #1e3a2ecc; backdrop-filter: blur(4px); color: #8bc34a; padding: 4px 10px; border-radius: 20px; font-size: 10px; z-index: 1001; pointer-events: none; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; display: flex; justify-content: center; align-items: center; color: white; font-size: 18px; backdrop-filter: blur(8px); }
        .export-btn { background: #1e3a2e; border: none; color: #8bc34a; padding: 5px 12px; border-radius: 30px; font-size: 11px; cursor: pointer; margin-left: 8px; }

        /* 手机端优化：地图缩小，列表上移，卡片紧凑 */
        @media (max-width: 780px) {
            #app { flex-direction: column; }
            #map { height: 32vh; min-height: 200px; }   /* 降低地图高度，给列表更多空间 */
            #side { width: 100%; height: 68vh; border-top: 2px solid #1e3044; } /* 列表占68% */
            #side-header { padding: 6px 10px; }
            #side-header h2 { font-size: 13px; }
            .stat { min-width: 58px; padding: 4px 1px; }
            .stat .v { font-size: 14px; }
            .filter-btn { padding: 4px 8px; font-size: 10px; }
            .status-filter-item { font-size: 10px; padding: 2px 8px; }
            .lead-card { padding: 6px 8px; margin: 4px 0; }
            .lc-name { font-size: 12px; }
            .lc-info { font-size: 9px; gap: 6px; }
            .lc-core { font-size: 10px; }
            .lc-actions a { font-size: 10px; padding: 2px 6px; }
            .lc-followup { gap: 4px; margin-top: 4px; }
            .status-select, .remark-btn, .remind-btn { font-size: 9px; padding: 2px 6px; }
            #lead-count { font-size: 10px; }
            .export-btn { font-size: 10px; padding: 4px 8px; }
            .leaflet-control-zoom { bottom: 10px; right: 10px; top: auto; }
        }

        @media (max-width: 480px) {
            .stat { min-width: 52px; }
            .stat .v { font-size: 13px; }
            .filter-btn { padding: 3px 6px; }
        }
    </style>
</head>
<body>
<div id="app" style="display: none;">
    <div id="map"></div>
    <div id="side">
        <div id="side-header">
            <div><h2>🎯 客户经理工作台</h2><div class="meta">脱核经营贷 | 跟进管理 | 数据导出</div></div>
            <div><button id="logoutBtn" class="logout-btn">🚪 退出</button></div>
        </div>
        <div id="stats">
            <div class="stat"><div class="v" id="stat-total">0</div><div class="l">商机总数</div></div>
            <div class="stat"><div class="v" id="stat-s">0</div><div class="l">S级</div></div>
            <div class="stat"><div class="v" id="stat-star">0</div><div class="l">⭐背书</div></div>
            <div class="stat"><div class="v" id="stat-strong">0</div><div class="l">强意愿</div></div>
            <div class="stat"><div class="v" id="stat-avg">0</div><div class="l">平均分</div></div>
            <div class="stat today-remind"><div class="v" id="stat-today">0</div><div class="l">今日待跟进</div></div>
        </div>
        <div id="filters">
            <input type="text" id="search" placeholder="🔍 搜索企业名/核心企业/产品" oninput="filterLeads()">
            <button class="filter-btn active" onclick="setDistrict('全部',this)">全部</button>
            <button class="filter-btn" onclick="setDistrict('米东',this)">米东</button>
            <button class="filter-btn" onclick="setDistrict('头屯河',this)">头屯河</button>
            <button class="filter-btn" onclick="setDistrict('新市区',this)">新市区</button>
            <button class="export-btn" onclick="exportToCSV()">📎 导出CSV</button>
        </div>
        <div class="status-filter" id="statusFilterBar">
            <span style="font-size:11px; margin-right:6px;">状态筛选：</span>
            <span data-status="全部" class="status-filter-item active" onclick="setStatusFilter('全部')">全部</span>
            <span data-status="待跟进" class="status-filter-item" onclick="setStatusFilter('待跟进')">待跟进</span>
            <span data-status="已联系" class="status-filter-item" onclick="setStatusFilter('已联系')">已联系</span>
            <span data-status="有意向" class="status-filter-item" onclick="setStatusFilter('有意向')">有意向</span>
            <span data-status="已签约" class="status-filter-item" onclick="setStatusFilter('已签约')">已签约</span>
            <span data-status="已放款" class="status-filter-item" onclick="setStatusFilter('已放款')">已放款</span>
            <span data-status="无效" class="status-filter-item" onclick="setStatusFilter('无效')">无效</span>
            <span data-status="今日提醒" class="status-filter-item" onclick="setStatusFilter('今日提醒')">📅 今日提醒</span>
        </div>
        <div id="lead-count">加载数据中...</div>
        <div id="lead-list"></div>
    </div>
</div>
<div id="legend2" style="display: none;">📊 图例 🔴S级 🟠A级 ⭐背书 ❤️强意愿 ▫️产业集群</div>
<div id="loadingIndicator" class="loading-overlay">📡 正在加载商机数据...</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // ---------- 用户数据管理 ----------
    let currentUsername = localStorage.getItem("trade_map_currentUser");
    if (!currentUsername) window.location.href = "index.html";

    function getUserDataKey() { return `trade_map_followup_${currentUsername}`; }
    function loadUserData() { return JSON.parse(localStorage.getItem(getUserDataKey())) || {}; }
    function saveUserData(data) { localStorage.setItem(getUserDataKey(), JSON.stringify(data)); }

    // 全局变量
    let map, markers = [], allLeads = [];
    let currentDistrict = '全部';
    let currentStatusFilter = '全部';

    // ---------- 高德导航 ----------
    function navigateToAmap(lat, lng, name) {
        if (!lat || !lng) return;
        const encodedName = encodeURIComponent(name || '目标位置');
        window.location.href = `https://uri.amap.com/navigation?to=${lng},${lat}&toName=${encodedName}&mode=car&callnative=1`;
    }

    // 弹窗
    function buildPopupHtml(lead, userData) {
        const starIcon = lead.star ? '⭐' : '';
        const status = userData[lead.rank]?.status || '待跟进';
        return `<div style="min-width:220px;">
            <h4>${starIcon} ${lead.name}</h4>
            <div class="pop-row"><strong>排名：</strong>#${lead.rank} | <strong>总分：</strong>${lead.total}分</div>
            <div class="pop-row"><strong>优先级：</strong>${lead.priority} | <strong>意愿度：</strong>${lead.willingness}</div>
            <div class="pop-row"><strong>📱 手机：</strong> <a href="tel:${lead.phone}" class="pop-phone-link">${lead.phone}</a></div>
            <div class="pop-row"><strong>📍 地址：</strong>${lead.address}</div>
            <div class="pop-row"><strong>🏭 核心企业：</strong>${lead.core_enterprise}</div>
            <div class="pop-row"><strong>🔗 绑定：</strong>${lead.binding}</div>
            <div class="pop-row"><strong>📦 产品：</strong>${lead.product}</div>
            <div class="pop-row"><a href="javascript:void(0)" onclick="navigateToAmap(${lead.lat}, ${lead.lng}, '${lead.name.replace(/'/g, "\\'")}')" class="pop-nav-link">🗺️ 高德导航</a></div>
            <div class="pop-row"><strong>跟进状态：</strong> ${status}</div>
        </div>`;
    }

    // 渲染地图标记
    function renderMarkers(leads, userData) {
        if (markers.length) markers.forEach(m => map.removeLayer(m));
        markers = [];
        leads.forEach(lead => {
            const color = lead.priority === 'S级' ? '#e53935' : '#ffa726';
            const radius = lead.priority === 'S级' ? 8 : 6;
            const m = L.circleMarker([lead.lat, lead.lng], {radius, color, fillColor:color, fillOpacity:0.7, weight: lead.star ? 2 : 1});
            m.bindPopup(buildPopupHtml(lead, userData));
            m._leadData = lead;
            m.addTo(map);
            markers.push(m);
        });
    }

    // 更新状态、备注、提醒
    function updateStatus(rank, newStatus) {
        let userData = loadUserData();
        if (!userData[rank]) userData[rank] = {};
        userData[rank].status = newStatus;
        saveUserData(userData);
        renderLeadList();
        renderMarkers(allLeads, loadUserData());
    }
    function editRemark(rank) {
        let userData = loadUserData();
        const currentRemark = userData[rank]?.remark || '';
        const newRemark = prompt('请输入备注（可记录沟通要点、联系人信息等）', currentRemark);
        if (newRemark !== null) {
            if (!userData[rank]) userData[rank] = {};
            userData[rank].remark = newRemark;
            saveUserData(userData);
            renderLeadList();
        }
    }
    function setRemind(rank) {
        let userData = loadUserData();
        const currentRemind = userData[rank]?.remindDate || '';
        const newRemind = prompt('请输入提醒日期（格式：2025-06-10）', currentRemind);
        if (newRemind && /^\d{4}-\d{2}-\d{2}$/.test(newRemind)) {
            if (!userData[rank]) userData[rank] = {};
            userData[rank].remindDate = newRemind;
            saveUserData(userData);
            renderLeadList();
            alert(`已设置 ${newRemind} 提醒`);
        } else if (newRemind) {
            alert('日期格式应为 YYYY-MM-DD');
        }
    }

    // 渲染商机列表
    function renderLeadList() {
        const userData = loadUserData();
        const searchTerm = document.getElementById('search').value.toLowerCase();
        let filtered = allLeads.filter(l => currentDistrict === '全部' || l.district === currentDistrict);
        
        if (currentStatusFilter !== '全部') {
            if (currentStatusFilter === '今日提醒') {
                const today = new Date().toISOString().slice(0,10);
                filtered = filtered.filter(l => userData[l.rank]?.remindDate === today);
            } else {
                filtered = filtered.filter(l => (userData[l.rank]?.status || '待跟进') === currentStatusFilter);
            }
        }
        if (searchTerm) {
            filtered = filtered.filter(l => l.name.toLowerCase().includes(searchTerm) || l.core_enterprise.toLowerCase().includes(searchTerm) || l.product.toLowerCase().includes(searchTerm) || l.industry.toLowerCase().includes(searchTerm));
        }
        document.getElementById('lead-count').textContent = `显示 ${filtered.length} 条商机`;
        
        // 地图标记可见性同步
        markers.forEach(m => {
            const lead = m._leadData;
            let visible = (currentDistrict === '全部' || lead.district === currentDistrict);
            if (currentStatusFilter !== '全部') {
                if (currentStatusFilter === '今日提醒') {
                    const today = new Date().toISOString().slice(0,10);
                    visible = visible && (userData[lead.rank]?.remindDate === today);
                } else {
                    visible = visible && (userData[lead.rank]?.status || '待跟进') === currentStatusFilter;
                }
            }
            if (visible && searchTerm) visible = lead.name.toLowerCase().includes(searchTerm) || lead.core_enterprise.toLowerCase().includes(searchTerm) || lead.product.toLowerCase().includes(searchTerm) || lead.industry.toLowerCase().includes(searchTerm);
            if (visible) { if (!map.hasLayer(m)) m.addTo(map); } else { if (map.hasLayer(m)) map.removeLayer(m); }
        });
        
        const container = document.getElementById('lead-list');
        container.innerHTML = filtered.map(l => {
            const starBadge = l.star ? '<span class="lc-badge badge-star">⭐背书</span>' : '';
            const priBadge = l.priority === 'S级' ? '<span class="lc-badge badge-s">S级</span>' : '<span class="lc-badge badge-a">A级</span>';
            const willBadge = l.willingness === '强' ? '<span class="lc-badge badge-strong">强意愿</span>' : '<span class="lc-badge badge-mid">中意愿</span>';
            const status = userData[l.rank]?.status || '待跟进';
            const remark = userData[l.rank]?.remark || '';
            const remindDate = userData[l.rank]?.remindDate || '';
            const statusOptions = ['待跟进','已联系','有意向','已签约','已放款','无效'];
            return `<div class="lead-card ${l.priority === 'S级' ? 'S' : 'A'}" onclick="flyToLead(${l.lat},${l.lng},'${l.name.replace(/'/g,"\\'")}')">
                <div class="lc-top"><div class="lc-name">#${l.rank} ${l.name}</div><div class="lc-badges">${starBadge}${priBadge}${willBadge}</div></div>
                <div class="lc-info"><span>🏭 ${l.industry}</span><span>💰 ${l.capital}万</span><span>📊 ${l.total}分</span></div>
                <div class="lc-core">⭐ 核心企业：${l.core_enterprise}</div>
                <div class="lc-actions">
                    <a href="tel:${l.phone}" onclick="event.stopPropagation()">📞 拨号</a>
                    <a href="javascript:void(0)" onclick="event.stopPropagation(); navigateToAmap(${l.lat}, ${l.lng}, '${l.name.replace(/'/g, "\\'")}')">🗺️ 导航</a>
                </div>
                <div class="lc-followup" onclick="event.stopPropagation()">
                    <select class="status-select" data-rank="${l.rank}" onchange="updateStatus(${l.rank}, this.value)">
                        ${statusOptions.map(opt => `<option value="${opt}" ${status === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                    </select>
                    <button class="remark-btn" onclick="editRemark(${l.rank})">📝 备注${remark ? '✓' : ''}</button>
                    <button class="remind-btn" onclick="setRemind(${l.rank})">⏰ ${remindDate || '提醒'}</button>
                </div>
            </div>`;
        }).join('');
        updateStats(filtered, userData);
    }
    
    function updateStats(filtered, userData) {
        document.getElementById('stat-total').innerText = filtered.length;
        document.getElementById('stat-s').innerText = filtered.filter(l=>l.priority==='S级').length;
        document.getElementById('stat-star').innerText = filtered.filter(l=>l.star).length;
        document.getElementById('stat-strong').innerText = filtered.filter(l=>l.willingness==='强').length;
        let avg = filtered.length ? Math.round(filtered.reduce((s,l)=>s+l.total,0)/filtered.length) : 0;
        document.getElementById('stat-avg').innerText = avg;
        const today = new Date().toISOString().slice(0,10);
        const todayCount = filtered.filter(l => userData[l.rank]?.remindDate === today).length;
        document.getElementById('stat-today').innerText = todayCount;
    }
    
    function setStatusFilter(status) {
        currentStatusFilter = status;
        document.querySelectorAll('.status-filter-item').forEach(el => {
            el.classList.remove('active');
            if (el.getAttribute('data-status') === status) el.classList.add('active');
        });
        renderLeadList();
    }
    
    window.flyToLead = function(lat,lng,name) {
        map.flyTo([lat,lng], 14, {duration:0.6});
        setTimeout(() => markers.forEach(m => { if(m._leadData.name === name) m.openPopup(); }), 700);
    };
    window.filterLeads = function() { renderLeadList(); };
    window.setDistrict = function(d, btn) {
        currentDistrict = d;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterLeads();
    };
    
    // 导出CSV
    function exportToCSV() {
        const userData = loadUserData();
        const searchTerm = document.getElementById('search').value.toLowerCase();
        let filtered = allLeads.filter(l => currentDistrict === '全部' || l.district === currentDistrict);
        if (searchTerm) filtered = filtered.filter(l => l.name.toLowerCase().includes(searchTerm) || l.core_enterprise.toLowerCase().includes(searchTerm) || l.product.toLowerCase().includes(searchTerm) || l.industry.toLowerCase().includes(searchTerm));
        const rows = filtered.map(l => {
            const ud = userData[l.rank] || {};
            return {
                "排名": l.rank,
                "企业名称": l.name,
                "行业": l.industry,
                "优先级": l.priority,
                "意愿度": l.willingness,
                "总分": l.total,
                "电话": l.phone,
                "地址": l.address,
                "核心企业": l.core_enterprise,
                "跟进状态": ud.status || "待跟进",
                "备注": ud.remark || "",
                "提醒日期": ud.remindDate || ""
            };
        });
        const csv = convertToCSV(rows);
        const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.setAttribute("download", `商机跟进_${currentUsername}_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }
    function convertToCSV(data) {
        const headers = Object.keys(data[0] || {});
        const rows = data.map(obj => headers.map(header => JSON.stringify(obj[header] || "")).join(","));
        return [headers.join(","), ...rows].join("\n");
    }
    window.exportToCSV = exportToCSV;
    window.updateStatus = updateStatus;
    window.editRemark = editRemark;
    window.setRemind = setRemind;
    window.setStatusFilter = setStatusFilter;
    
    // ---------- 地图初始化 (真实OSM地图) ----------
    function initMap() {
        map = L.map('map').setView([43.87, 87.60], 11);
        // 更真实的标准 OpenStreetMap 瓦片 (高德/百度风格)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 贡献者',
            maxZoom: 19,
            minZoom: 9
        }).addTo(map);
        if(window.innerWidth <= 780) map.zoomControl.setPosition('bottomright');
        window.addEventListener('resize', () => map.invalidateSize());
        
        // 静态底图
        const districtsPoly = {
            "头屯河": [[43.92,87.38],[43.95,87.42],[43.95,87.53],[43.90,87.54],[43.88,87.50],[43.85,87.46],[43.86,87.40],[43.89,87.37]],
            "新市区": [[43.92,87.50],[43.93,87.58],[43.90,87.63],[43.87,87.64],[43.83,87.60],[43.83,87.55],[43.87,87.51],[43.90,87.49]],
            "米东": [[43.98,87.55],[44.05,87.58],[44.08,87.68],[44.05,87.78],[43.98,87.79],[43.92,87.76],[43.90,87.68],[43.94,87.57]]
        };
        for(let [name,coords] of Object.entries(districtsPoly)) {
            L.polygon(coords, {color:"#3388ff", weight:1.2, fillOpacity:0.08, fillColor:"#3388ff"}).addTo(map).bindTooltip(name+"片区");
        }
        const clusters = [
            {name:"风电装备集群",lat:43.88,lng:87.43,radius:6000},
            {name:"石油化工集群",lat:43.99,lng:87.70,radius:5000},
            {name:"电力装备集群",lat:43.87,lng:87.56,radius:4500}
        ];
        clusters.forEach(c => {
            L.circle([c.lat,c.lng], {radius:c.radius, color:"#f47738", weight:1.5, dashArray:'5 5', fill:false}).addTo(map).bindTooltip(c.name);
        });
        const coreFirms = [
            {name:"金风科技",lat:43.88,lng:87.43},{name:"八一钢铁",lat:43.89,lng:87.42},
            {name:"特变电工",lat:43.88,lng:87.55},{name:"中石油乌石化",lat:43.99,lng:87.69},
            {name:"中泰化学",lat:43.80,lng:87.58}
        ];
        coreFirms.forEach(f => {
            L.circleMarker([f.lat,f.lng], {radius:8, color:"#d95f02", fillColor:"#d95f02", fillOpacity:0.8, weight:2}).addTo(map).bindPopup(`<b>${f.name}</b><br>核心企业`);
        });
    }
    
    // 加载商机JSON
    async function loadData() {
        try {
            const response = await fetch('data/opportunities.json');
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            if (!data || !data.leads || !Array.isArray(data.leads)) throw new Error('数据格式错误');
            allLeads = data.leads;
            document.getElementById('loadingIndicator').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            document.getElementById('legend2').style.display = 'block';
            if (!map) initMap();
            const userData = loadUserData();
            renderMarkers(allLeads, userData);
            renderLeadList();
        } catch (err) {
            console.error(err);
            document.getElementById('loadingIndicator').innerHTML = '❌ 数据加载失败，请刷新重试<br><small>' + err.message + '</small>';
        }
    }
    
    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem("trade_map_currentUser");
        window.location.href = "index.html";
    });
    
    loadData();
</script>
</body>
</html>
